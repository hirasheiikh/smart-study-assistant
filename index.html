  if (bIdx) bIdx.onclick = function(){ openIndexModal(); };
  var bAss = document.getElementById('bAssistant');
  if (bAss) bAss.onclick = function(){ openAssistantDrawer(); };
  var bh = document.getElementById('bHide');
  if (bh) bh.onclick = function(){ document.body.classList.toggle('hide'); bh.classList.toggle('on'); };
  var bAdd = document.getElementById('bAddTask');
  if (bAdd) bAdd.onclick = function(){ openAddTaskModal(); };
  var bRef = document.getElementById('bRefresh');
  if (bRef) bRef.onclick = function(){ fetchLatestFromCloud(false); };
  var bLogout = document.getElementById('bLogout');
  if (bLogout) bLogout.onclick = function(){
    try {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
    } catch(e){}
    showLogin();
  };

  
  // Navegació ràpida des dels xips del dashboard
  document.addEventListener('click', function(e){
    var chip = e.target.closest('.dqi-chip');
    if (chip) {
      e.preventDefault();
      var href = chip.getAttribute('href') || '';
      var targetId = href.replace(/^#/, '');
      if (targetId) {
        var viewId = 'plan';
        if (targetId.startsWith('0-')) viewId = 'exams';
        else if (targetId.startsWith('1-') || targetId.startsWith('2-') || targetId.startsWith('3-')) viewId = 'guide';
        else if (targetId.startsWith('8-')) viewId = 'checks';
        else if (targetId.startsWith('9-')) viewId = 'control';
        gotoView(viewId);
        setTimeout(function(){
          var el = document.getElementById(targetId) || main.querySelector('[id="' + targetId + '"]');
          if (el) {
            var wk = el.closest('.week');
            if (wk && wk.classList.contains('collapsed')) wk.classList.remove('collapsed');
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('flash-highlight');
            setTimeout(function(){ el.classList.remove('flash-highlight'); }, 2000);
          }
        }, 70);
      }
    }
  });

  setupAssistantFloatingButton();
  render();

  // 🚀 Auto-sincronització en temps real bidireccional (mòbil <-> ordinador)
  fetchLatestFromCloud(true);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      fetchLatestFromCloud(true);
    }
  });
  window.addEventListener('focus', function() {
    fetchLatestFromCloud(true);
  });
  setInterval(function() {
    fetchLatestFromCloud(true);
  }, 20000);

  try {
    if (window.claude && window.claude.use){
      window.claude.use('artifact').then(function(a){
        art = a;
        if (a && st) st.textContent = '';
      }, function(){});
    }
  } catch(e){}
}

function showLogin(){
  root.innerHTML = '';
  var loginBox = document.createElement('div');
  loginBox.className = 'login-screen';
  loginBox.innerHTML = '<div class="login-card">' +
    '<div class="login-icon">🔒</div>' +
    '<h2>Accés al Planning</h2>' +
    '<p>Introdueix el PIN o contrasenya per accedir al teu planning de finals.</p>' +
    '<div class="login-field">' +
      '<input type="password" id="loginPass" placeholder="PIN d\'accés..." autocomplete="current-password" />' +
    '</div>' +
    '<div class="login-field-check">' +
      '<label><input type="checkbox" id="loginRemember" checked /> Recorda\'m en aquest dispositiu</label>' +
    '</div>' +
    '<button type="button" id="btnLogin">Entrar</button>' +
    '<div id="loginErr" class="login-error"></div>' +
  '</div>';
  root.appendChild(loginBox);

  var passInput = document.getElementById('loginPass');
  var btn = document.getElementById('btnLogin');
  var err = document.getElementById('loginErr');
  var remember = document.getElementById('loginRemember');

  function doLogin(){
    var v = passInput.value.trim();
    if (!v) { err.textContent = 'Introdueix una contrasenya'; return; }
    var valid = ['1795022026', 'finals2026', 'hira2026', 'finals'].indexOf(v.toLowerCase()) >= 0 || v === EXPECTED_HASH;
    if (valid) {
      try {
        if (remember.checked) {
          localStorage.setItem(AUTH_KEY, EXPECTED_HASH);
        } else {
          sessionStorage.setItem(AUTH_KEY, EXPECTED_HASH);
        }
      } catch(e){}
      startApp();
    } else {
      err.textContent = 'PIN o contrasenya incorrecta';
      passInput.value = '';
      passInput.focus();
    }
  }

  btn.onclick = doLogin;
  passInput.onkeydown = function(e){
    if (e.key === 'Enter') doLogin();
  };
  passInput.focus();
}

function checkAuth(){
  var s = null;
  try { s = localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY); } catch(e){}
  if (s === EXPECTED_HASH) {
    startApp();
  } else {
    showLogin();
  }
}

checkAuth();
})();
</script></body></html>
