        msgBox.scrollTop = msgBox.scrollHeight;
      }
    }
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onVvResize);
    window.visualViewport.addEventListener('scroll', onVvResize);
    setTimeout(onVvResize, 50);
  }

  input.addEventListener('focus', function() {
    onVvResize();
    setTimeout(onVvResize, 100);
    setTimeout(onVvResize, 300);
  });

  input.addEventListener('blur', function() {
    setTimeout(function() {
      onVvResize();
      window.scrollTo(0, 0);
    }, 100);
  });

  function closeDrawer() {
    document.body.classList.remove('assistant-drawer-open');
    if (window.visualViewport) {
      window.visualViewport.removeEventListener('resize', onVvResize);
      window.visualViewport.removeEventListener('scroll', onVvResize);
    }
    overlay.remove();
    if (savedScrollY > 0) {
      window.scrollTo(0, savedScrollY);
    }
  }
  document.getElementById('btnCloseAssistant').onclick = closeDrawer;
  overlay.onclick = function(e) { if (e.target === overlay) closeDrawer(); };

  var clearBtn = document.getElementById('btnClearAssistant');
  if (clearBtn) {
    clearBtn.onclick = function() {
      if (confirm('Vols esborrar l\'historial d\'aquesta conversa amb l\'assistent?')) {
        clearAssistantHistory();
        msgBox.innerHTML = '';
        appendAssistantBubble('assistant', 'Hola! 🌟 Hem reiniciat la conversa. En què et puc ajudar avui?');
      }
    };
  }

  overlay.querySelectorAll('.assistant-chip').forEach(function(chip) {
    chip.onclick = function() {
      input.value = chip.dataset.query;
      handleSend();
    };
  });

  if (assistantHistory.length === 0) {
    appendAssistantBubble('assistant', 'Hola! 🌟 Soc el teu assistent d\'estudi intel·ligent integrat directament al teu planning.\n\nEm pots demanar:\n• **Buscador de forats:** *«Quan creus que hauria de fer X?»* per analitzar els dies més tranquils.\n• **Canvis directes:** *«Apunta\'m una reunió de projecte divendres»* o *«esborra tal tasca»*.\n• **Consultes d\'agenda:** *«Què he de fer demà?»*\n\nEn què et puc ajudar avui?');
  } else {
    assistantHistory.forEach(function(item) {
      appendAssistantBubble(item.sender, item.text);
    });
    setTimeout(function() {
      msgBox.scrollTop = msgBox.scrollHeight;
    }, 50);
  }

  function handleSend() {
    if (sendBtn.disabled) return;
    var query = input.value.trim();
    if (!query) return;
    input.value = '';
    sendBtn.disabled = true;

    appendAssistantBubble('user', query);
    assistantHistory.push({ sender: 'user', text: query });
    saveAssistantHistory();

    var typingId = appendAssistantBubble('assistant', 'Pensant i consultant el teu planning... ⏳');

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller ? setTimeout(function() { controller.abort(); }, 25000) : null;

    fetch('/api/assistant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller ? controller.signal : undefined,
      body: JSON.stringify({
        message: query,
        history: assistantHistory.map(function(h){ return { role: h.sender === 'user' ? 'user' : 'assistant', text: h.text }; }),
        todayISO: todayISO
      })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (timer) clearTimeout(timer);
      sendBtn.disabled = false;
      var typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();

      if (data && data.reply) {
        appendAssistantBubble('assistant', data.reply);
        assistantHistory.push({ sender: 'assistant', text: data.reply });
        saveAssistantHistory();

        if (data.actions && data.actions.length > 0) {
          appendAssistantActionCard(data.actions, data.summary || data.actionSummary || 'Vols aplicar aquests canvis al teu planning?');
        }
      } else {
        appendAssistantBubble('assistant', 'No he pogut obtenir una resposta vàlida. Si us plau, torna-ho a provar!');
      }
    })
    .catch(function(err) {
      if (timer) clearTimeout(timer);
      sendBtn.disabled = false;
      console.error(err);
      var typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();
      var errMsg = (err && err.name === 'AbortError')
        ? '⏱️ L\'assistent ha trigat massa a respondre. Torna-ho a provar ara!'
        : '⚠️ Hi ha hagut un error connectant amb l\'assistent. Torna-ho a provar!';
      appendAssistantBubble('assistant', errMsg);
    });
  }

  sendBtn.onclick = handleSend;
  input.onkeydown = function(e) {
    if (e.key === 'Enter') handleSend();
    if (e.key === 'Escape') closeDrawer();
  };
  if (window.innerWidth > 600) {
    input.focus();
  }
}

function appendAssistantBubble(sender, rawText) {
  var msgBox = document.getElementById('assistantChatMessages');
  if (!msgBox) return null;
  var bId = 'bubble-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 4);
  var div = document.createElement('div');
  div.id = bId;
  div.className = 'chat-bubble ' + (sender === 'user' ? 'bubble-user' : 'bubble-assistant');
  div.innerHTML = formatMarkdownBasic(rawText);
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
  return bId;
}

function appendAssistantActionCard(actions, summary) {
  var msgBox = document.getElementById('assistantChatMessages');
  if (!msgBox) return;

  var card = document.createElement('div');
  card.className = 'assistant-action-card';

  var actionsListHtml = actions.map(function(act) {
    var type = act.type;
    if (type === 'add' || type === 'add_task') {
      return '<li>➕ <b>Afegir a ' + esc(act.day) + ':</b> ' + esc(act.text) + '</li>';
    } else if (type === 'move' || type === 'move_task') {
      return '<li>⏩ <b>Moure tasca:</b> ' + esc(act.query || act.text || '') + ' a ' + esc(act.target_date || act.toDay || '') + '</li>';
    } else if (type === 'delete' || type === 'delete_task') {
      return '<li>🗑️ <b>Esborrar:</b> ' + esc(act.query || act.text || '') + '</li>';
    } else if (type === 'edit' || type === 'edit_task') {
      return '<li>✏️ <b>Modificar:</b> ' + esc(act.query || '') + ' → ' + esc(act.newText || act.text || '') + '</li>';
    } else if (type === 'toggle_done') {
      return '<li>✓ <b>Marcar com a ' + (act.done ? 'feta' : 'pendent') + '</b></li>';
    }
    return '<li>' + esc(JSON.stringify(act)) + '</li>';
  }).join('');

  card.innerHTML = '<div class="action-card-header">⚡ <b>Acció suggerida</b></div>' +
    '<div class="action-card-body">' + esc(summary) + '</div>' +
    '<ul class="action-card-list">' + actionsListHtml + '</ul>' +
    '<div class="action-card-buttons">' +
      '<button type="button" class="btn-action-apply">Aplica els canvis</button>' +
      '<button type="button" class="btn-action-dismiss">Descarta</button>' +
    '</div>';

  var applyBtn = card.querySelector('.btn-action-apply');
  var dismissBtn = card.querySelector('.btn-action-dismiss');

  applyBtn.onclick = function() {
    applyBtn.disabled = true;
    applyBtn.textContent = 'Aplicant... ⏳';

    fetch('/api/assistant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'execute_actions',
        actions: actions
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res && res.ok) {
        card.innerHTML = '<div class="action-card-applied">✓ Canvis aplicats correctament al teu planning i al calendari! 🎉</div>';
        fetchLatestFromCloud(false);
      } else {
        card.innerHTML = '<div class="action-card-applied" style="color:#e11d48">⚠️ Error en aplicar els canvis.</div>';
      }
    })
    .catch(function(err) {
      card.innerHTML = '<div class="action-card-applied" style="color:#e11d48">⚠️ Error de xarxa en aplicar els canvis.</div>';
    });
  };

  dismissBtn.onclick = function() {
    card.remove();
  };

  msgBox.appendChild(card);
  msgBox.scrollTop = msgBox.scrollHeight;
}

// ===================== STATS & LIFECYCLE =====================
function counts(){
  var all = counted.length, n = 0;
  counted.forEach(function(id){ if (done.has(id)) n++; });
  var p = all ? Math.round(100 * n / all) : 0;
  var pc = document.getElementById('pc');
  var pr = document.getElementById('prog');
  if (pc) pc.textContent = p + '%';
  if (pr) {
    var pi = pr.querySelector('i');
    if (pi) pi.style.width = p + '%';
  }
  document.title = '(' + p + '%) ' + TITLE;
}

function snapshot(){
  return { done: Array.from(done), t: Date.now() };
}

function buildDoc(s){
  var c = tpl.content.cloneNode(true);
  assignCkIds(c);
  var doc = document.implementation.createHTMLDocument(TITLE);
  var bs = doc.createElement('style');
  var cs = document.getElementById('css');
  bs.textContent = cs ? cs.textContent : '';
  doc.head.appendChild(bs);
  var rootDiv = doc.createElement('div');
  rootDiv.id = 'root';
  doc.body.appendChild(rootDiv);
  var tnode = doc.createElement('template');
  tnode.id = 'content';
  tnode.innerHTML = tpl.innerHTML;
  doc.body.appendChild(tnode);
  var sc = doc.createElement('script');
  sc.id = 'state';
  sc.type = 'application/json';
  sc.textContent = JSON.stringify(s);
  doc.body.appendChild(sc);
  var ap = doc.createElement('script');
  ap.id = 'app';
  var ascript = document.getElementById('app');
  ap.textContent = ascript ? ascript.textContent : '';
  doc.body.appendChild(ap);
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function changed(){
  counts();
  var s = snapshot();
  try { localStorage.setItem(LS, JSON.stringify(s)); } catch(e){}
  if (art && art.save) {
    if (st) st.textContent = '…';
    art.save(buildDoc(s)).then(function(){
      if (st) st.textContent = 'desat';
      setTimeout(function(){ if (st) st.textContent = ''; }, 1200);
    }, function(){
      if (st) st.textContent = 'error en desar';
    });
  }
}

function startApp(){
  root.innerHTML = '';
  var mobHdr = buildMobileHeader();
  root.appendChild(mobHdr);
  buildSidebar();
  root.appendChild(bar);
  root.appendChild(main);

  st = document.getElementById('status');
  if (st) {
    try {
      var obs = new MutationObserver(function() {
        var mob = document.getElementById('mobStatus');
        if (mob && st) {
          mob.textContent = st.textContent;
          mob.style.display = st.textContent ? 'inline-block' : 'none';
        }
      });
      obs.observe(st, { childList: true, characterData: true, subtree: true });
    } catch(e){}
  }

  var bMobSync = document.getElementById('bMobSync');
  if (bMobSync) bMobSync.onclick = function() {
    bMobSync.classList.add('rotating');
    Promise.resolve(fetchLatestFromCloud(false)).then(function() {
      setTimeout(function() { if (bMobSync) bMobSync.classList.remove('rotating'); }, 500);
    }).catch(function() {
      if (bMobSync) bMobSync.classList.remove('rotating');
    });
  };
  var bMobHide = document.getElementById('bMobHide');
  if (bMobHide) bMobHide.onclick = function() { toggleHideDone(); };
  var bMobMenu = document.getElementById('bMobMenu');
  if (bMobMenu) bMobMenu.onclick = function() { openMobileMenuModal(); };

  var bIdx = document.getElementById('bIndex');
  if (bIdx) bIdx.onclick = function(){ openIndexModal(); };
  var bAss = document.getElementById('bAssistant');
  if (bAss) bAss.onclick = function(){ openAssistantDrawer(); };
  var bh = document.getElementById('bHide');
  if (bh) bh.onclick = function(){ toggleHideDone(); };
  toggleHideDone(ui.hideDone);
  var bAdd = document.getElementById('bAddTask');
  if (bAdd) bAdd.onclick = function(){ openAddTaskModal(); };
  var bRef = document.getElementById('bRefresh');
  if (bRef) bRef.onclick = function(){
    bRef.classList.add('rotating');
    Promise.resolve(fetchLatestFromCloud(false)).then(function() {
      setTimeout(function() { if (bRef) bRef.classList.remove('rotating'); }, 500);
    }).catch(function() {
      if (bRef) bRef.classList.remove('rotating');
    });
  };
  var bLogout = document.getElementById('bLogout');
  if (bLogout) bLogout.onclick = function(){
    try {
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
    } catch(e){}
    showLogin();
  };

  
  // Navegació ràpida des dels xips del dashboard
  document.addEventListener('click', function(e){
    var chip = e.target.closest('.dqi-chip');
    if (chip) {
      e.preventDefault();
      var href = chip.getAttribute('href') || '';
      var targetId = href.replace(/^#/, '');
      if (targetId) {
        var viewId = 'plan';
        if (targetId.startsWith('0-') || targetId === 'examens' || targetId === 'assignatures') viewId = 'exams';
        else if (targetId.startsWith('1-') || targetId.startsWith('2-') || targetId.startsWith('3-')) viewId = 'guide';
        else if (targetId.startsWith('8-')) viewId = 'checks';
        else if (targetId.startsWith('9-')) viewId = 'control';
        gotoView(viewId);
        setTimeout(function(){
          var el = document.getElementById(targetId) || main.querySelector('[id="' + targetId + '"]');
          if (el) {
            var wk = el.closest('.week');
            if (wk && wk.classList.contains('collapsed')) wk.classList.remove('collapsed');
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('flash-highlight');
            setTimeout(function(){ el.classList.remove('flash-highlight'); }, 2000);
          }
        }, 70);
      }
    }
  });

  setupAssistantFloatingButton();
  render();

  // 🚀 Auto-sincronització en temps real bidireccional (mòbil <-> ordinador)
  fetchLatestFromCloud(true);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      fetchLatestFromCloud(true);
    }
  });
  window.addEventListener('focus', function() {
    fetchLatestFromCloud(true);
  });
  setInterval(function() {
    fetchLatestFromCloud(true);
  }, 20000);

  try {
    if (window.claude && window.claude.use){
      window.claude.use('artifact').then(function(a){
        art = a;
        if (a && st) st.textContent = '';
      }, function(){});
    }
  } catch(e){}
}

function showLogin(){
  root.innerHTML = '';
  var loginBox = document.createElement('div');
  loginBox.className = 'login-screen';
  loginBox.innerHTML = '<div class="login-card">' +
    '<div class="login-icon">🔒</div>' +
    '<h2>Accés al Planning</h2>' +
    '<p>Introdueix el PIN o contrasenya per accedir al teu planning de finals.</p>' +
    '<div class="login-field">' +
      '<input type="password" id="loginPass" placeholder="PIN d\'accés..." autocomplete="current-password" />' +
    '</div>' +
    '<div class="login-field-check">' +
      '<label><input type="checkbox" id="loginRemember" checked /> Recorda\'m en aquest dispositiu</label>' +
    '</div>' +
    '<button type="button" id="btnLogin">Entrar</button>' +
    '<div id="loginErr" class="login-error"></div>' +
  '</div>';
  root.appendChild(loginBox);

  var passInput = document.getElementById('loginPass');
  var btn = document.getElementById('btnLogin');
  var err = document.getElementById('loginErr');
  var remember = document.getElementById('loginRemember');

  function doLogin(){
    var v = passInput.value.trim();
    if (!v) { err.textContent = 'Introdueix una contrasenya'; return; }
    var valid = ['study2026', 'study'].indexOf(v.toLowerCase()) >= 0 || v === EXPECTED_HASH;
    if (valid) {
      try {
        if (remember.checked) {
          localStorage.setItem(AUTH_KEY, EXPECTED_HASH);
        } else {
          sessionStorage.setItem(AUTH_KEY, EXPECTED_HASH);
        }
      } catch(e){}
      startApp();
    } else {
      err.textContent = 'PIN o contrasenya incorrecta';
      passInput.value = '';
      passInput.focus();
    }
  }

  btn.onclick = doLogin;
  passInput.onkeydown = function(e){
    if (e.key === 'Enter') doLogin();
  };
  passInput.focus();
}

function checkAuth(){
  var s = null;
  try { s = localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY); } catch(e){}
  if (s === EXPECTED_HASH) {
    startApp();
  } else {
    showLogin();
  }
}

checkAuth();
})();
  </script>
